<div class="form-group">
    <div class="form-group">
        <label for="haUrl" class="form-label">Home Assistant URL:</label>
        <input type="text" id="haUrl" name="haUrl" class="form-input" value="{{ defaults.haUrl }}">
    </div>
</div>
<div class="form-group">
    <span style="color: var(--text-primary);">Needs a long-lived Home Assistant token saved as HOME_ASSISTANT_TOKEN under API Keys. Entity ids are fixed in the plugin for the FoxESS, Solcast, myenergi and Octopus integrations.</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings && pluginSettings.haUrl) {
            document.getElementById('haUrl').value = pluginSettings.haUrl;
        }
    });
</script>
