<div class="form-group">
    <div class="form-group nowrap">
        <label for="feed" class="form-label">Section:</label>
        <select id="feed" name="feed" class="form-input">
            {% for feed in feeds %}
            <option value="{{ feed.id }}">{{ feed.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group nowrap">
        <label for="storyCount" class="form-label">Stories:</label>
        <select id="storyCount" name="storyCount" class="form-input">
            {% for count in story_counts %}
            <option value="{{ count }}">{{ count }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="showLeadImage" class="form-label">Lead story image:</label>
        <div class="toggle-container">
            <input type="checkbox" id="showLeadImage" name="showLeadImage" class="toggle-checkbox" value="false"
                onclick="this.value = this.checked ? 'true' : 'false'">
            <label for="showLeadImage" class="toggle-label"></label>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        let feed = "top";
        let storyCount = "4";
        if (loadPluginSettings) {
            feed = pluginSettings.feed || feed;
            storyCount = pluginSettings.storyCount || storyCount;
            const lead = document.getElementById('showLeadImage');
            lead.checked = pluginSettings.showLeadImage === "true";
            lead.value = lead.checked ? 'true' : 'false';
        }
        document.getElementById('feed').value = feed;
        document.getElementById('storyCount').value = storyCount;
    });
</script>
